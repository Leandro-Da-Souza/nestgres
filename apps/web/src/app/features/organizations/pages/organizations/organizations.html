@if( organizationData$ | async; as organizations ) {
  <div class="table-container">
    <table>
      <thead>
      <tr>
        <th>Name</th>
        <th>Plan</th>
        <th>Country</th>
        <th>Created</th>
      </tr>
      </thead>

      <tbody>
        @for (org of organizations; track org.id)  {
          <tr>
            <td>{{ org.name }}</td>
            <td>
              <app-badge
                [label]="org.plan"
                [tone]="badgeMap.get(org.plan) ?? 'neutral'"
              />
            </td>
            <td>{{ org.countryCode }}</td>
            <td>{{ org.createdAt | date }}</td>
            <td>
              <app-button type="button" [variant]="'primary'"
                          (click)="handleNavigation(org.id)">More
                Info</app-button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4">No organization found</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
