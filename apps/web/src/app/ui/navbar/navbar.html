<nav [class]="className()">
  <div class="navbar__container">
      <h2 class="navbar__logo">Nestgres</h2>
      <ul class="navbar__items">
        @for (link of links; track link.name) {
          <li class="navbar__item">
            <a class="navbar__link" routerLink="{{link.path}}" routerLinkActive="active-link">{{link.name}}</a>
          </li>
        }
      </ul>
    <app-dropdown class="navbar__dropdown">
      <app-logout-button></app-logout-button>
    </app-dropdown>
  </div>
</nav>
