<nav [class]="className()">
  <div class="navbar__container">
      <h3 class="navbar__logo">Nestgres</h3>
      <ul class="navbar__links">
        @for (link of links; track link.name) {
          <li class="navbar__link">
            <a routerLink="{{link.path}}" routerLinkActive="active-link">{{link.name}}</a>
          </li>
        }
      </ul>
  </div>
</nav>
