  <div class="organization-grouped-bar">
    <app-bar-chart [title]="selectedCurrency() + ' invoices by organization'"
                           [data]="organizationChartData()"></app-bar-chart>
    <div class="organization-grouped-bar__currency-container">
      @for (cur of allowedCurrencies; track cur) {
        <app-button
          (click)="handleSelectCurrency(cur)"
          class="organization-group-bar__currency-container__btn"
          [variant]="selectedCurrency() === cur ? 'primary' : 'secondary'">{{ cur }}</app-button>
      }
    </div>
  </div>
